<div class="col-md-6 col-lg-4">
  <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
  {% if prefix %}
    <div class="input-group has-validation">
      <span class="input-group-text" aria-hidden="true">{{ prefix }}</span>
  {% endif %}
  {{ field }}
  {% if field.errors %}
    <div class="invalid-feedback" id="{{ field.auto_id }}_error">
      {{ field.errors|join:" " }}
    </div>
  {% endif %}
  {% if prefix %}
    </div>
  {% endif %}
  {% if field.help_text %}
    <div class="form-text" id="{{ field.auto_id }}_helptext">
      {{ field.help_text }}
      {% if source %}<a href="{{ source.1 }}">{{ source.0 }}</a>{% endif %}
    </div>
  {% endif %}
</div>
